    <title>Cadastre-se</title>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    .cbc{
        background-color: #3b2422;
        width: 100%;
        height: 25vh;
        display: flex;
        flex-direction: row;
        align-items: start;
        justify-content: flex-start;
        gap: 10px;
    }

    .divcorpo form{
        background: url(IMG_0286.JPG.jpeg);
        background-size: cover;
        background-position: center;
        width: 100%;
        height: 75vh;
        align-items: center;
        justify-content: center;
        display: flex;


    }

    .divcrp{
        background: rgba(0, 0, 0, 0.623);
        border: 2px solid #fff;
        backdrop-filter: blur(20px);
        border-radius: 10px;
        width: 95%;
        height: 70vh;
        display: flex;
        flex-direction: row;
        gap: 2px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
    }

    .divcbc{
        background-color: transparent;
        width: 550px;
        height: 50px;
        gap: 20px;
        display: flex;
        
    }

    .divcp{
        
        width: 200px;
        height: 100px;
    }

     .divcp{
        position: relative;
        margin: 10px;
        height: 10%;
        width: 30%;
        text-align: center;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
     }

     

       .divcp input{
        width: 100%;
        height: 10%;
        background: transparent;
        border: none;
        outline: none;
        border: 2px solid #fffbfb;
        border-radius: 10px;
        font-size: 16px;
        color: #fff;
        padding: 20px 45px 20px 20px;
    }

    .divcp input::placeholder{
        color: #fff;
    }

    .divcp16{
        width: 100%;
        height: 100px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    
          .submit-button{
        width: 100px;
        height: 50px;
        background-color: #087f46;
        border: none;
        border-radius: 10px;
        color: #fff;
        font-weight: 500;
        margin-top: 24px;
        cursor: pointer;
        outline: none;
        font-size: 16px;
    }
        

     .submit-button:hover{
        background-color: #0ebb67;
    }

    .reset-button{
        width: 100px;
        height: 50px;
        background-color: red;
        border: none;
        border-radius: 10px;
        color: #fff;
        font-weight: 500;
        margin-top: 24px;
        cursor: pointer;
        outline: none;
        font-size: 16px;
    }

     .reset-button:hover{
        background-color:rgb(236, 62, 62);
    }

    .divcp img{
    
        position: absolute;
        right: 17px;
        top: 50%;
        margin-top: 5px;
    }

    .divcp5 {
        color: white;
    }



</style>
<body>



    
    <div class="cbc">
<div class="divcbc 1"><img 
             src="https://cdn.corenexis.com/f/EkL79QDKRZV.png" width="300px" height="200px">
            </div>



            
<div class="divcbc 2" style="color: #fff; font-size: 30px; top: 10px;"><h1>Faça seu cadastro</h1></div>
<div class="divcbc 3"></div> <nav class="navbar navbar-expand-lg navbar-light bg-light">

    <div class="divcorpo">
      <form method="post" action="Proj_login.html">

        <div class="divcrp">
            

            
            

        <div class="divcp 1">
             <label>Primeiro nome:</label><br>
                    <input type="text"  id="nome" name="nome" placeholder="Digite seu primeiro nome" required autofocus>
                    <img width="30" height="30" src="https://img.icons8.com/ios-filled/50/FFFFFF/checked-identification-documents--v1.png" alt="checked-identification-documents--v1"/>
        </div>

        <div class="divcp 2">
             <label>Sobrenome:</label><br>
                    <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required>
                     <img width="30" height="30" src="https://img.icons8.com/ios-filled/50/FFFFFF/checked-identification-documents--v1.png" alt="checked-identification-documents--v1"/>
        </div>

        <div class="divcp 3">
             <label>CPF:</label><br>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                     <img width="30" height="30" src="https://img.icons8.com/ios-filled/50/FFFFFF/checked-identification-documents--v1.png" alt="checked-identification-documents--v1"/>
        </div>

        <div class="divcp 4"> 
            <label>RG:</label><br>
                    <input type="text" id="rg" name="rg" placeholder="0000000000" required>
                     <img width="30" height="30" src="https://img.icons8.com/ios-filled/50/FFFFFF/checked-identification-documents--v1.png" alt="checked-identification-documents--v1"/>
                </div>

        <div class="divcp 5">
             <label>Data de nascimento:</label><br>
                    <input type="date" id="data" name="data">
        </div>

        <div class="divcp 6">
             <label>Nacionalidade:</label><br>
                    <input type="text" id="nacionalidade" name="nacionalidade" placeholder="Ex: Brasileiro" required>
                    <img width="30" height="30" src="https://img.icons8.com/ios-filled/50/FFFFFF/earth-planet.png" alt="earth-planet"/>
        </div>

        <div class="divcp 7">
             <label>CEP:</label><br>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                    <img width="27" height="27" src="https://img.icons8.com/ios-filled/50/FFFFFF/map-pin.png" alt="map-pin"/>
        </div>

        <div class="divcp 8">
             <label>Endereço:</label><br>
                    <input type="text" id="endereço" name="endereço" placeholder="Ex: rua, número e complemento" required>
                    <img width="30" height="30" src="https://img.icons8.com/pulsar-line/48/FFFFFF/location.png" alt="location"/>

        </div>
        
        <div class="divcp 9"> <label>Bairro:</label><br>
                    <input type="text" id="bairro" name="bairro" placeholder="Digite seu bairro" required>
                    <img width="30" height="30" src="https://img.icons8.com/fluency-systems-regular/48/FFFFFF/map-marker.png" alt="map-marker"/>
                </div>

        <div class="divcp 10"><label>Cidade/Estado:</label><br>
                    <input type="text" id="cidade" name="cidade" placeholder="Ex: Porto Alegre, RS" required>
<img width="25" height="25" src="https://img.icons8.com/ios-filled/50/FFFFFF/place-marker--v1.png" alt="place-marker--v1"/>                </div>

        <div class="divcp 11">
              <label>Celular:</label><br>
                    <input type="tel" id="celular" name="celular" placeholder="(00)00000-0000" required>
<img width="30" height="30" src="https://img.icons8.com/dotty/80/FFFFFF/phone-disconnected.png" alt="phone-disconnected"/>
        </div>

        <div class="divcp 12">
             <label>E-Mail:</label><br>
                    <input type="email" id="email" name="email" placeholder="Ex: usuario@email.com" required>
<img width="30" height="30" src="https://img.icons8.com/ios/50/FFFFFF/apple-mail.png" alt="apple-mail"/>
        </div>

        <div class="divcp 13">
            <label>Senha:</label><br>
            <input type="password" id="psw" name="psw" placeholder="Digite sua senha" required>
            <img width="27" height="27" src="https://img.icons8.com/fluency-systems-regular/48/FFFFFF/password--v1.png" alt="password--v1"/>
        </div>

        <div class="divcp 14">
            <label>Confirme sua senha:</label><br>
            <input type="password" id="psw2" name="psw2" placeholder="Digite novamente sua senha" required>
            <img width="27" height="27" src="https://img.icons8.com/fluency-systems-regular/48/FFFFFF/password--v1.png" alt="password--v1"/>
        </div>

         <div class="divcp 15">  
            <label>Envie sua foto:</label><br>
                    <input type="file" style="border: none; ">
                </div>

        <div class="divcp16">
            <div>
            <input class="submit-button" type="submit" value="Concluir" >
            </div>

            <div>
            <input class="reset-button" type="reset" value="Limpar">
            </div>

        

       

        </div>

         </form>

        </div>

    
</body>
</html>
